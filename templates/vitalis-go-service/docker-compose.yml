services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitalis
      POSTGRES_PASSWORD: vitalis
      POSTGRES_DB: vitalis_service
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitalis -d vitalis_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://vitalis:vitalis@postgres:5432/vitalis_service?sslmode=disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    entrypoint: ["/app/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://vitalis:vitalis@postgres:5432/vitalis_service?sslmode=disable
      REDIS_ADDR: redis:6379
      EVENTS_STREAM: vitalis.events
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
