services:
  gateway:
    build: .
    env_file: .env
    environment:
      HTTP_ADDR: ":8080"
      JWKS_URL: http://host.docker.internal:8081/v1/auth/jwks.json
      UPSTREAM_IDENTITY: http://host.docker.internal:8081
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
