openapi: 3.0.3
info:
  title: Vitalis Support API
  version: 0.1.0
  description: |
    Tickets e central de ajuda.

    Contrato canonico Vitalis-contracts. Clientes publicos via Gateway :8080.
servers:
  - url: http://localhost:8088
    description: Servico direto (rede interna)
  - url: http://localhost:8080
    description: Via Gateway
tags:
  - name: health
  - name: domain
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      tags: [health]
      summary: Readiness
      security: []
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }

  /v1/tickets:
    get:
      tags: [domain]
      summary: Listar tickets
      responses: { '200': { description: Lista } }
    post:
      tags: [domain]
      summary: Abrir ticket
      responses: { '201': { description: Criado } }
  /v1/tickets/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domain]
      summary: Detalhe ticket
      responses: { '200': { description: Ticket }, '403': { description: Sem acesso } }
  /v1/tickets/{id}/comentarios:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [domain]
      summary: Comentar
      responses: { '201': { description: Comentario } }
  /v1/artigos-ajuda:
    get:
      tags: [domain]
      summary: Listar artigos
      security: []
      responses: { '200': { description: Lista } }
  /v1/artigos-ajuda/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [domain]
      summary: Ler artigo
      security: []
      responses: { '200': { description: Artigo } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string }
      description: Obrigatorio em POST de cobranca/assinatura (Billing).
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema: { type: string }
  schemas:
    Error:
      type: object
      required: [erro, codigo]
      properties:
        erro: { type: string }
        codigo: { type: string }
        request_id: { type: string }
        detalhes:
          type: object
          additionalProperties: true
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { type: string }
